<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Suryaa Jewels Craft</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to Suryaa Jewels Craft to explore our bespoke 22K gold jewelry." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://suryaajewels.in/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Raleway:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-bg: #E9ECE5;
        --color-text: #29302B;
        --color-text-secondary: #5A625A;
        --color-border: #C8CEC5;
        --color-light: #F4F5F1;
        --color-gold: #B08D45;
      }
      * { box-sizing: border-box; }
      html { overflow-x: hidden; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      header {
        padding: clamp(20px, 4vw, 32px) clamp(20px, 5vw, 64px);
      }
      .brand {
        display: inline-block;
        text-decoration: none;
        color: inherit;
      }
      .wordmark {
        display: block;
        font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
        font-size: clamp(22px, 2.6vw, 28px);
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .microLabel {
        display: block;
        font-size: 11px;
        letter-spacing: 0.26em;
        color: var(--color-text-secondary);
        margin-top: 2px;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px clamp(24px, 6vw, 64px) 96px;
      }
      .content {
        max-width: 560px;
      }
      .code {
        font-size: 13px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--color-gold);
        margin-bottom: 16px;
      }
      h1 {
        font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
        font-weight: 500;
        font-size: clamp(28px, 4.4vw, 44px);
        line-height: 1.15;
        margin: 0 0 20px;
      }
      p {
        font-size: 16px;
        line-height: 1.7;
        color: var(--color-text-secondary);
        margin: 0 0 36px;
      }
      .cta {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        background: var(--color-text);
        color: var(--color-light);
        padding: 15px 32px;
        border: 1px solid var(--color-text);
        transition: background 150ms ease;
      }
      .cta:hover {
        background: #454f47;
      }
      footer {
        padding: 20px clamp(20px, 5vw, 64px);
        border-top: 1px solid var(--color-border);
        font-size: 12px;
        color: var(--color-text-secondary);
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .cta { transition: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="brand">
        <span class="wordmark">SURYAA</span>
        <span class="microLabel">JEWELS CRAFT</span>
      </a>
    </header>

    <main>
      <div class="content">
        <div class="code">404</div>
        <h1>This Page Has Been Recast</h1>
        <p>
          The page you're looking for has been melted down and reforged into
          something else — or it never existed at all. Let's get you back to
          solid ground.
        </p>
        <a href="/" class="cta">Back to Home</a>
      </div>
    </main>

    <footer>© 2026 Suryaa Jewels Craft. All rights reserved.</footer>
  </body>
</html>
