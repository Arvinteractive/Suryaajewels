<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hand-forged 22K gold jewelry from a third-generation Coimbatore atelier. Bespoke haarams, bridal trousseaus, and custom heirloom pieces by master goldsmiths." />
    <title>Suryaa Jewels Craft | Bespoke 22K Gold Jewelry in Coimbatore</title>
    <!-- LCP element: the hero is a CSS background, so the preload scanner
         would otherwise not find it until the stylesheet has parsed. -->
    <link rel="preload" as="image" href="/images/hero-fullbleed.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Raleway:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Rendered via a portal, outside ScrollSmoother's transformed #root
      content — position: fixed inside a transformed ancestor gets dragged
      along with it, so the nav has to live here to stay pinned.
    -->
    <div id="nav-portal"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
